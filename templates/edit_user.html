<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - College From Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dash-body">
<div class="sidebar">
    <div class="sidebar-logo">🎓 CFH</div>
    <nav>
        <a href="/admin" class="nav-link">👑 Dashboard</a>
        <a href="/admin#users" class="nav-link active">👥 Manage Users</a>
    </nav>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
</div>
<div class="main-content">
    <div class="dash-header">
        <h1>✏️ Edit User</h1>
        <a href="/admin" class="btn-primary-sm">← Back to Dashboard</a>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}{% endif %}
    {% endwith %}
    <div class="section-card" style="max-width:600px;">
        <h2>✏️ Edit User Details</h2>
        <form method="POST" action="/admin/edit_user/{{ user[0] }}" class="upload-form">
            <div class="form-group-dash">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ user[1] }}" required>
            </div>
            <div class="form-group-dash">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ user[2] }}" required>
            </div>
            <div class="form-group-dash">
                <label>Password</label>
                <input type="text" name="password" value="{{ user[3] }}" required>
            </div>
            <div class="form-group-dash">
                <label>Role</label>
                <select name="role" required>
                    <option value="teacher" {% if user[4] == 'teacher' %}selected{% endif %}>Teacher</option>
                    <option value="student" {% if user[4] == 'student' %}selected{% endif %}>Student</option>
                </select>
            </div>
            <button type="submit" class="btn-primary-sm">💾 Save Changes</button>
        </form>
    </div>
</div>
</body>
</html>
